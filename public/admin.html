<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ניהול תוכן - Leny V Ron</title>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</head>
<body>
    <script>
        CMS.init({
            backend: {
                name: 'github',
                repo: 'razazu/leny-v-ron',
                branch: 'main',
                base_url: 'https://leny-v-ron.netlify.app',
                auth_endpoint: 'https://github.com/login/oauth/authorize',
                client_id: 'Ov23lis8YNAcuAvQfKOe'
            },
            media_folder: 'public/images/products',
            public_folder: '/images/products',
            collections: [
                {
                    name: 'homepage',
                    label: 'דף הבית',
                    file: 'src/content/homepage.json',
                    fields: [
                        { name: 'heroTitle', label: 'כותרת ראשית', widget: 'string' },
                        { name: 'heroSubtitle', label: 'כותרת משנה', widget: 'string' },
                        { name: 'heroDescription', label: 'תיאור', widget: 'text' },
                        { 
                            name: 'features', 
                            label: 'תכונות', 
                            widget: 'list', 
                            fields: [
                                { name: 'icon', label: 'אייקון', widget: 'string' },
                                { name: 'title', label: 'כותרת', widget: 'string' },
                                { name: 'description', label: 'תיאור', widget: 'string' }
                            ]
                        }
                    ]
                },
                {
                    name: 'about',
                    label: 'דף אודות',
                    file: 'src/content/about.json',
                    fields: [
                        { name: 'title', label: 'כותרת', widget: 'string' },
                        { name: 'story', label: 'תוכן', widget: 'text' },
                        { name: 'stat1Number', label: 'מספר סטטיסטיקה 1', widget: 'string' },
                        { name: 'stat1Label', label: 'תווית סטטיסטיקה 1', widget: 'string' },
                        { name: 'stat2Number', label: 'מספר סטטיסטיקה 2', widget: 'string' },
                        { name: 'stat2Label', label: 'תווית סטטיסטיקה 2', widget: 'string' }
                    ]
                },
                {
                    name: 'contact',
                    label: 'פרטי התקשרות',
                    file: 'src/content/contact.json',
                    fields: [
                        { name: 'phone', label: 'טלפון', widget: 'string' },
                        { name: 'email', label: 'אימייל', widget: 'string' },
                        { name: 'address', label: 'כתובת', widget: 'string' },
                        { name: 'whatsappLink', label: 'לינק וואטסאפ', widget: 'string' },
                        { name: 'instagramLink', label: 'לינק אינסטגרם', widget: 'string' }
                    ]
                }
            ]
        });
    </script>
</body>
</html>
